<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kids center</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#1f2a2e; --mute:#7b8588; --line:#e8e3da; --teal:#1f8a8a; --teal2:#d9f0ee; --sun:#f2b84b; --rose:#e4675b; --green:#3f9b6a; --radius:18px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: 'Nunito', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; display: flex; flex-direction: column; }
  header { padding: 14px 16px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  header small { display: block; font-size: 12px; color: var(--mute); font-weight: 600; margin-bottom: 2px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg,var(--teal),#5cc2b4); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  nav { display: flex; gap: 6px; padding: 8px 12px 10px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  nav::-webkit-scrollbar { display: none; }
  nav button { font: inherit; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 0; background: transparent; color: var(--mute); cursor: pointer; white-space: nowrap; }
  nav button.on { background: var(--ink); color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 0 var(--line); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .ring { width: 84px; height: 84px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .ring::before { content: ''; position: absolute; inset: 9px; background: var(--card); border-radius: 50%; }
  .ring b { position: relative; font-size: 20px; font-weight: 800; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 2px 0 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { font: inherit; font-weight: 700; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--mute); cursor: pointer; white-space: nowrap; }
  .chip.on { border-color: var(--teal); background: var(--teal2); color: var(--teal); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kid { background: var(--card); border-radius: var(--radius); padding: 12px 6px 10px; text-align: center; cursor: pointer; border: 2px solid transparent; position: relative; box-shadow: 0 1px 0 var(--line); }
  .kid.here { border-color: var(--green); background: #f1faf4; }
  .kid.away { opacity: .55; }
  .face { font-size: 30px; line-height: 1; margin-bottom: 6px; }
  .kid b { display: block; font-size: 12.5px; font-weight: 800; line-height: 1.2; }
  .kid span.tag { position: absolute; top: 6px; right: 6px; font-size: 13px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--teal2); color: var(--teal); }
  .pill.warn { background: #fdecc8; color: #9a6a00; } .pill.bad { background: #fbe1de; color: #b5392e; } .pill.ok { background: #dff3e6; color: #2f7d52; }
  h2 { font-size: 13px; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .07em; margin: 14px 2px 8px; }
  .btn { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 14px; background: var(--teal); color: #fff; cursor: pointer; }
  .btn.ghost { background: var(--teal2); color: var(--teal); }
  .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .month button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card); font-size: 16px; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
  .pay { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .pay:first-of-type { border-top: 0; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .dot.paid { background: var(--green); border-color: var(--green); }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); border-radius: 8px; }
  .st { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .st:first-of-type { border-top: 0; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--teal2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .post { margin-bottom: 12px; }
  .post .meta { font-size: 12px; color: var(--mute); font-weight: 700; margin-bottom: 6px; }
  .post p { line-height: 1.5; }
  .tr { margin-top: 8px; font-size: 12.5px; font-weight: 800; color: var(--teal); cursor: pointer; background: none; border: 0; font-family: inherit; }
  input[type=search] { width: 100%; font: inherit; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); margin-bottom: 10px; color: var(--ink); }
  input[type=search]:focus { outline: none; border-color: var(--teal); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(20,28,30,.45); display: none; z-index: 50; }
  .sheet-bg.on { display: block; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 24px 24px 0 0; padding: 18px 16px 22px; max-height: 82%; overflow-y: auto; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .big { font-size: 46px; text-align: center; }
  .sheet h3 { text-align: center; font-size: 18px; font-weight: 800; margin: 4px 0 2px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .kv span:first-child { color: var(--mute); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; display: none; z-index: 60; }
  .empty { text-align: center; color: var(--mute); padding: 26px 0; font-weight: 700; }
</style></head>
<body>
<header><div><small id="date"></small><h1 id="title"></h1></div><div class="logo">🌱</div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var ALLOWED = ["https://assist9998.github.io", "http://localhost", "http://127.0.0.1"];
  if (window.top !== window) {
    var o = []; try { var ao = window.location.ancestorOrigins; if (ao && ao.length) o = [].slice.call(ao); } catch (e) {}
    if (!o.length && document.referrer) { try { o = [new URL(document.referrer).origin]; } catch (e) {} }
    if (o.length && !o.every(function (x) { return ALLOWED.some(function (a) { return x === a || x.indexOf(a + ":") === 0; }); })) { document.documentElement.innerHTML = "<body style='font-family:system-ui;padding:24px;text-align:center'>This demo opens only on the author's site.</body>"; return; }
  }
  var EN = new URLSearchParams(location.search).get("lang") !== "ru";
  document.documentElement.lang = EN ? "en" : "ru";
  var t = function (en, ru) { return EN ? en : ru; };

  // ── данные (выдуманные) ──
  var GROUPS = [["Seedlings", "Малыши", "2–3"], ["Sprouts", "Ростки", "3–4"], ["Explorers", "Исследователи", "4–5"], ["Pioneers", "Первопроходцы", "5–6"]];
  var NAMES = ["Mia Carter", "Leo Evans", "Zoe Parker", "Noah Hughes", "Ella Brooks", "Max Turner", "Ivy Foster", "Finn Hayes", "Ruby Bell", "Jack Reed", "Lily Ward", "Owen Cole", "Nora Price", "Theo Grant", "Cleo Rivera", "Ben Shaw", "Maya Lane", "Liam Fox", "Ada Stone", "Kai Moore", "Rosa Webb", "Sam Cook", "Luna Bates", "Eli Marsh"];
  var FACES = ["🐻", "🦊", "🐼", "🐯", "🦁", "🐸", "🐰", "🐨", "🦄", "🐙", "🐥", "🦋"];
  var ALLERGY = { 1: ["🥜", "Nuts", "Орехи"], 5: ["🥛", "Lactose", "Лактоза"], 9: ["🍓", "Strawberries", "Клубника"], 14: ["🥚", "Eggs", "Яйца"], 19: ["🥜", "Nuts", "Орехи"] };
  var CLUBS = ["Art", "Dance", "English", "Chess"], CLUBS_RU = ["Рисование", "Танцы", "Английский", "Шахматы"];
  var kids = NAMES.map(function (n, i) {
    return { id: i, name: n, face: FACES[(n.length * 7 + i) % FACES.length], g: Math.floor(i / 6), nap: i % 3 !== 2, allergy: ALLERGY[i] || null, bday: i === 3 ? 0 : i === 11 ? 2 : -1,
      club: i % 3 === 0 ? (i / 3) % 4 : -1, parent: ["Anna", "Mark", "Julia", "Tom", "Sara", "Paul"][i % 6] + " " + n.split(" ")[1], phone: "+62 811 000 " + (1000 + i * 7) };
  });
  var MONTHS = [["Oct", "Окт"], ["Nov", "Ноя"]], MN = ["October", "November"], MNR = ["Октябрь", "Ноябрь"];
  var paid = {}; kids.forEach(function (k) { paid[k.id + ":0"] = true; paid[k.id + ":1"] = k.id % 5 !== 3 && k.id % 7 !== 6; });
  var FEE = [320, 320, 360, 360];
  var staff = [
    { n: "Sarah Mills", r: ["Group lead", "Воспитатель"], f: "👩‍🏫", s: "in", days: 14, late: 1, leave: 0 },
    { n: "Dewi Putri", r: ["Assistant", "Помощник"], f: "🧑‍🍼", s: "late", days: 13, late: 3, leave: 1 },
    { n: "Made Surya", r: ["Driver", "Водитель"], f: "🚐", s: "in", days: 14, late: 0, leave: 0 },
    { n: "Olga Ivanova", r: ["Teacher", "Педагог"], f: "👩‍🎨", s: "in", days: 12, late: 0, leave: 2 },
    { n: "Kadek Ayu", r: ["Cook", "Повар"], f: "🧑‍🍳", s: "off", days: 11, late: 0, leave: 3 },
    { n: "Tom Reeves", r: ["Coach", "Тренер"], f: "🏃", s: "in", days: 9, late: 1, leave: 0 },
  ];
  var LEAVES = [["Kadek Ayu", "16 Nov", "Ceremony day", "Церемония"], ["Olga Ivanova", "20 Nov", "Day off", "Отгул"]];
  var POSTS = [
    { who: ["Sarah Mills", "Sarah Mills"], when: ["Today, 08:40", "Сегодня, 08:40"], en: "Pioneers will have a short trip to the beach on Friday. Please bring a hat and a water bottle.", ru: "В пятницу Первопроходцы едут на короткую прогулку к морю. Возьмите панамку и бутылочку с водой.", tr: false },
    { who: ["Made Surya", "Made Surya"], when: ["Yesterday", "Вчера"], en: "Minibus route changed for two days because of the road works near the market.", ru: "Маршрут микроавтобуса изменён на два дня из-за ремонта дороги у рынка.", tr: false },
    { who: ["Olga Ivanova", "Olga Ivanova"], when: ["12 Nov", "12 ноя"], en: "New week of the Art club: we paint with sand and coloured salt.", ru: "Новая неделя кружка рисования: рисуем песком и цветной солью.", tr: false },
  ];

  var tab = "today", grp = -1, month = 1, q = "";
  var $ = function (id) { return document.getElementById(id); };
  var TABS = [["today", "Today", "Сегодня"], ["kids", "Kids", "Дети"], ["pay", "Payments", "Оплаты"], ["staff", "Team", "Команда"], ["feed", "Feed", "Лента"]];
  function gname(i) { return t(GROUPS[i][0], GROUPS[i][1]); }
  function toast(m) { var e = $("toast"); e.textContent = m; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = "none"; }, 1600); }
  $("date").textContent = t("Friday, 13 November", "Пятница, 13 ноября");

  function render() {
    $("title").textContent = TABS.filter(function (x) { return x[0] === tab; })[0][EN ? 1 : 2];
    $("nav").innerHTML = TABS.map(function (x) { return '<button data-t="' + x[0] + '" class="' + (tab === x[0] ? "on" : "") + '">' + (EN ? x[1] : x[2]) + "</button>"; }).join("");
    $("nav").querySelectorAll("button").forEach(function (b) { b.onclick = function () { tab = b.dataset.t; render(); $("main").scrollTop = 0; }; });
    var m = $("main");
    if (tab === "today") m.innerHTML = vToday(); else if (tab === "kids") m.innerHTML = vKids(); else if (tab === "pay") m.innerHTML = vPay(); else if (tab === "staff") m.innerHTML = vStaff(); else m.innerHTML = vFeed();
    bind();
  }
  function groupChips() { return '<div class="chips"><button class="chip ' + (grp < 0 ? "on" : "") + '" data-g="-1">' + t("All", "Все") + "</button>" + GROUPS.map(function (g, i) { return '<button class="chip ' + (grp === i ? "on" : "") + '" data-g="' + i + '">' + gname(i) + "</button>"; }).join("") + "</div>"; }
  function vToday() {
    var list = kids.filter(function (k) { return grp < 0 || k.g === grp; });
    var here = list.filter(function (k) { return k.here === true; }).length, away = list.filter(function (k) { return k.here === false; }).length, un = list.length - here - away;
    var deg = list.length ? Math.round(here / list.length * 360) : 0;
    var bd = kids.filter(function (k) { return k.bday >= 0; });
    return '<div class="card row"><div class="ring" style="background:conic-gradient(var(--teal) ' + deg + 'deg,var(--line) 0)"><b>' + here + "/" + list.length + '</b></div><div class="grow"><b style="font-size:16px">' + t("Attendance today", "Посещаемость сегодня") + '</b><div style="margin-top:6px"><span class="pill ok">' + here + " " + t("here", "пришли") + '</span> <span class="pill bad">' + away + " " + t("absent", "нет") + '</span> <span class="pill warn">' + un + " " + t("not marked", "не отмечены") + "</span></div></div></div>" +
      (bd.length ? '<div class="card row" style="background:#fff7e3"><span style="font-size:26px">🎂</span><div class="grow"><b>' + bd.map(function (k) { return k.name.split(" ")[0]; }).join(", ") + '</b><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + t("Birthdays today and in 2 days", "Дни рождения сегодня и через 2 дня") + "</div></div></div>" : "") +
      groupChips() + '<div class="grid">' + list.map(function (k) { return '<div class="kid ' + (k.here === true ? "here" : k.here === false ? "away" : "") + '" data-k="' + k.id + '">' + (k.allergy ? '<span class="tag">' + k.allergy[0] + "</span>" : "") + '<div class="face">' + k.face + "</div><b>" + k.name.split(" ")[0] + "</b></div>"; }).join("") + "</div>" +
      '<p style="text-align:center;color:var(--mute);font-weight:700;margin-top:14px">' + t("Tap a child to mark. Tap again to change.", "Нажмите на ребёнка, чтобы отметить. Ещё раз, чтобы изменить.") + "</p>";
  }
  function vKids() {
    var list = kids.filter(function (k) { return (grp < 0 || k.g === grp) && k.name.toLowerCase().indexOf(q.toLowerCase()) >= 0; });
    return '<input type="search" id="q" placeholder="' + t("Search a child", "Поиск ребёнка") + '" value="' + q.replace(/"/g, "") + '">' + groupChips() + (list.length ? list.map(function (k) { return '<div class="card row" data-card="' + k.id + '" style="cursor:pointer"><div class="av">' + k.face + '</div><div class="grow"><b>' + k.name + '</b><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + gname(k.g) + (k.club >= 0 ? " · " + t(CLUBS[k.club], CLUBS_RU[k.club]) : "") + '</div></div><div>' + (k.allergy ? '<span class="pill warn">' + k.allergy[0] + " " + t(k.allergy[1], k.allergy[2]) + "</span>" : "") + "</div></div>"; }).join("") : '<div class="empty">' + t("Nobody found", "Никого не найдено") + "</div>");
  }
  function vPay() {
    var out = '<div class="month"><button data-m="-1">‹</button><b style="font-size:16px">' + t(MN[month], MNR[month]) + ' 2026</b><button data-m="1">›</button></div>';
    var total = 0, got = 0;
    GROUPS.forEach(function (g, gi) {
      var ks = kids.filter(function (k) { return k.g === gi; });
      var p = ks.filter(function (k) { return paid[k.id + ":" + month]; }).length;
      total += ks.length * FEE[gi]; got += p * FEE[gi];
      out += '<div class="card"><div class="row" style="margin-bottom:8px"><b class="grow">' + gname(gi) + '</b><span class="pill">' + p + "/" + ks.length + '</span></div><div class="bar" style="margin-bottom:8px"><i style="width:' + (p / ks.length * 100) + '%"></i></div>' +
        ks.map(function (k) { var on = paid[k.id + ":" + month]; return '<div class="pay" data-p="' + k.id + '"><span class="dot ' + (on ? "paid" : "") + '">' + (on ? "✓" : "") + '</span><span class="grow">' + k.name + '</span><span style="color:var(--mute);font-weight:800">' + FEE[gi] + " " + t("c.u.", "у. е.") + "</span></div>"; }).join("") + "</div>";
    });
    return '<div class="card row"><div class="grow"><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + t("Collected", "Собрано") + '</div><b style="font-size:22px">' + got.toLocaleString(EN ? "en-US" : "ru-RU") + " " + t("c.u.", "у. е.") + '</b></div><div style="text-align:right"><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + t("Expected", "Ожидается") + '</div><b>' + total.toLocaleString(EN ? "en-US" : "ru-RU") + "</b></div></div>" + out;
  }
  var SS = ["in", "late", "off"];
  function vStaff() {
    var sl = { in: [t("On site", "На месте"), "ok"], late: [t("Late", "Опоздал(а)"), "warn"], off: [t("Off", "Выходной"), "bad"] };
    return '<h2 style="margin-top:4px">' + t("Today", "Сегодня") + "</h2>" + '<div class="card">' + staff.map(function (s, i) { return '<div class="st" data-s="' + i + '" style="cursor:pointer"><div class="av">' + s.f + '</div><div class="grow"><b>' + s.n + '</b><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + t(s.r[0], s.r[1]) + '</div></div><span class="pill ' + sl[s.s][1] + '">' + sl[s.s][0] + "</span></div>"; }).join("") + "</div>" +
      "<h2>" + t("Planned days off", "Запланированные отгулы") + "</h2>" + '<div class="card">' + LEAVES.map(function (l) { return '<div class="st"><span style="font-size:20px">🗓️</span><div class="grow"><b>' + l[0] + '</b><div style="color:var(--mute);font-weight:700;font-size:12.5px">' + l[1] + " · " + t(l[2], l[3]) + "</div></div></div>"; }).join("") + "</div>" +
      "<h2>" + t("November summary", "Сводка за ноябрь") + "</h2>" + '<div class="card">' + staff.map(function (s) { return '<div class="st"><div class="grow"><b>' + s.n + '</b><div class="bar" style="margin-top:6px"><i style="width:' + Math.min(100, s.days / 14 * 100) + '%"></i></div></div><div style="text-align:right;font-weight:800;font-size:12.5px">' + s.days + " " + t("days", "дн.") + '<div style="color:var(--mute)">' + s.late + " " + t("late", "опозд.") + " · " + s.leave + " " + t("off", "выходн.") + "</div></div></div>"; }).join("") + "</div>";
  }
  function vFeed() {
    return POSTS.map(function (p, i) { return '<div class="card post"><div class="meta">' + t(p.who[0], p.who[1]) + " · " + t(p.when[0], p.when[1]) + "</div><p>" + (p.tr ? (EN ? p.ru : p.en) : (EN ? p.en : p.ru)) + '</p><button class="tr" data-tr="' + i + '">🌐 ' + (p.tr ? t("Show original", "Показать оригинал") : t("Translate to Russian", "Перевести на английский")) + "</button></div>"; }).join("");
  }
  function sheet(k) {
    var due = !paid[k.id + ":1"];
    $("sheet").innerHTML = '<div class="big">' + k.face + "</div><h3>" + k.name + '</h3><div style="text-align:center;margin-bottom:10px;color:var(--mute);font-weight:700">' + gname(k.g) + " · " + t("age", "возраст") + " " + GROUPS[k.g][2] + "</div>" +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px">' + (k.allergy ? '<span class="pill warn">' + k.allergy[0] + " " + t(k.allergy[1], k.allergy[2]) + "</span>" : '<span class="pill ok">' + t("No allergies", "Без аллергий") + "</span>") + '<span class="pill">' + (k.nap ? "😴 " + t("Nap time", "Тихий час") : "🌞 " + t("No nap", "Без сна")) + "</span>" + (due ? '<span class="pill bad">' + t("Payment due", "Долг по оплате") + "</span>" : "") + "</div>" +
      '<div class="kv"><span>' + t("Parent", "Родитель") + "</span><span>" + k.parent + '</span></div><div class="kv"><span>' + t("Phone", "Телефон") + "</span><span>" + k.phone + '</span></div><div class="kv"><span>' + t("Club", "Кружок") + "</span><span>" + (k.club >= 0 ? t(CLUBS[k.club], CLUBS_RU[k.club]) : "—") + '</span></div>' +
      '<button class="btn" style="width:100%;margin-top:14px" id="close">' + t("Close", "Закрыть") + "</button>";
    $("bg").classList.add("on"); $("close").onclick = function () { $("bg").classList.remove("on"); };
  }
  $("bg").onclick = function (e) { if (e.target === $("bg")) $("bg").classList.remove("on"); };
  function bind() {
    var m = $("main");
    m.querySelectorAll("[data-g]").forEach(function (b) { b.onclick = function () { grp = +b.dataset.g; render(); }; });
    m.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { var k = kids[+b.dataset.k]; k.here = k.here === true ? false : true; render(); toast(k.name.split(" ")[0] + " · " + (k.here ? t("here", "пришёл") : t("absent", "отсутствует"))); }; });
    m.querySelectorAll("[data-card]").forEach(function (b) { b.onclick = function () { sheet(kids[+b.dataset.card]); }; });
    m.querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { var key = b.dataset.p + ":" + month; paid[key] = !paid[key]; render(); }; });
    m.querySelectorAll("[data-m]").forEach(function (b) { b.onclick = function () { month = Math.max(0, Math.min(1, month + +b.dataset.m)); render(); }; });
    m.querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () { var s = staff[+b.dataset.s]; s.s = SS[(SS.indexOf(s.s) + 1) % 3]; render(); }; });
    m.querySelectorAll("[data-tr]").forEach(function (b) { b.onclick = function () { var p = POSTS[+b.dataset.tr]; p.tr = !p.tr; render(); }; });
    var qi = $("q"); if (qi) qi.oninput = function () { q = qi.value; var pos = qi.selectionStart; render(); var n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
  }
  render();
})();
</script>
</body></html>
